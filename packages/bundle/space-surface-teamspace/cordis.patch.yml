# space-surface-teamspace —— 团队空间面（P5）：client-ui 包族 + 5174（原样迁入）
#
# 本面与 space-base 不得出现同 id（断言③）。用户层在 profiles/teamspace/cordis.patch.yml。
#
# 从旧 cordis.yml 原样迁入（2026-09-28 P5），注释保留原决策上下文。

# ── 团队空间面（P4，端口 5174）─────────────────────────────────────────
# 与 5172 调试控制台同款拓扑：第二个 server 实例（isolate 换名 realm）+
# webui 只认这个 realm 的 server。页面菜单：时间线 / 输入区 / 轮次状态 / 成员。
- id: teamspace-server
  name: '@cordisjs/plugin-server'
  isolate:
    server: teamspace
  config:
    host: !!js process.env.APP_HOST ?? '0.0.0.0'
    port: !!js Number(process.env.TEAMSPACE_PORT ?? 5174)

# Cordis 的 timer 插件会向 Context 混入 timeout/interval 等访问器，不能在同一
# 进程注册第二份；5174 与 5172 共用 space-base 提供的单例 timer。
- id: teamspace-webui
  name: '@cordisjs/plugin-webui'
  isolate:
    server: teamspace
    webui: teamspace
  config:
    devMode: false
    open: false

# 页面包（官方三件套：client 源码 + dist/manifest.json；devMode false 只读产物）。
# 一页整体（用户拍板「不要散页」）：时间线 + 轮次状态/成员 + 输入区在一个
# component 里组合。isolate.webui 指到 teamspace realm；session/eventLog/ui/
# staging/orchestrator 仍走 root（那些服务全局只有一份）。
- id: client-ui-teamspace
  name: './packages/client-ui/space-client-ui-teamspace/src/index.ts'
  isolate:
    webui: teamspace

# 左侧会话栏（2026-09-29 改版，铁律 4「入驻 = 纯新增」的形状证据）：
# 不注册页面（不加菜单项），client 侧经 router.slot 挂到整页预留的
# 'space-teamspace-sidebar' 槽位；停用本行 = 槽位无视图 = 页面左区自然收空。
- id: client-ui-sessions
  name: './packages/client-ui/space-client-ui-sessions/src/index.ts'
  isolate:
    webui: teamspace

# 消息推送页内通道（IM 化，2026-09-30）：socket 广播 'space:event'，挂在
# teamspace realm（isolate.webui）—— 与本面的 webui 同 realm 才看得见。
- id: space-push
  name: './plugins/space-push/index.ts'
  isolate:
    webui: teamspace

# 团队登录/注册页（/login）：仅负责 Team 身份认证并进入 Teamspace；后台
# 管理入口由独立 Admin UI 提供，不在 Teamspace 中展示或转发。
- id: client-ui-auth
  name: './packages/client-ui/space-client-ui-auth/src/index.ts'
  isolate:
    webui: teamspace

# 知识库管理页（2026-10-01，新包）：独立页面 /kb，知识库文档增删 + 检索 +
# 向量检索状态显示。isolate.webui 指到 teamspace realm。
- id: client-ui-kb
  name: './packages/client-ui/space-client-ui-kb/src/index.ts'
  isolate:
    webui: teamspace
