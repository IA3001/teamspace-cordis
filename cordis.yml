# 插件组合清单（cordis 的「应用」就是这个文件）
#
# 格式（官方约束，核实日期 2026-09-26）：
#   · 顶层必须是**数组**，每个元素是一个插件的配置项
#   · 每项字段：id / name / config / disabled / inject / group
#   · name 是模块指定符（相对路径或 npm 包名）
#   · 各项并发启动，加载先后由服务依赖（inject）决定，与书写顺序无关
#   来源：@cordisjs/plugin-include 校验逻辑（非数组即报错）
#        https://deepseek-harness.github.io/deepseek-harness/develop/cordis-tutorial/01-first-plugin
#
# 启用/关闭插件：删掉 `disabled` 行即启用；写 `disabled: true` 即停用。
# 停用后该插件注册的一切（服务、事件、定时器）会被框架自动回滚。
#
# !!js 是 include 插件官方的表达式标签，在 loader 上下文中求值
#   （实现：new Function("ctx", "expr", "with (ctx) { return eval(expr) }")）。
#   端口因此能从 .env 注入，不必在 YAML 里再写一遍数字。

# ── 框架设施 ────────────────────────────────────────────────────────────
# 官方 HTTP 服务（提供 ctx.server，路由挂在它上面）。
# host/port 来自 .env —— 全系统端口唯一出处，不在这里写死数字。
- id: server
  name: '@cordisjs/plugin-server'
  config:
    host: !!js process.env.APP_HOST ?? '0.0.0.0'
    port: !!js Number(process.env.APP_PORT ?? 8080)

# ── 业务插件 ────────────────────────────────────────────────────────────
# 健康检查：证明端口真的在听，也是后续所有路由的样板（inject 声明依赖）。
- id: health
  name: './plugins/health/index.ts'

# 最早那个试金石插件，保留用于验证「加功能 = 加插件」。
- id: app
  name: './plugins/app/index.ts'
  config:
    greeting: cordis 框架已启动，一切就绪

# 曾试挂官方 @cordisjs/plugin-logger（控制台日志导出器），**已撤掉**：
# 它与 cordis@4.0.0-rc.10 组合下 ctx.logger().info/warn/error 全部静默
# （实测 3 次，2026-09-26）。core 自带的 ctx.logger.exporter({ export })
# 接口本身可用，是插件侧的消息形状没接上 —— RC 阶段的集成缺口。
# 需要日志时再单独写一个基于 core 接口的 logger 插件。

# ── 调试控制台（M1）────────────────────────────────────────────────────
# 目标：在 DEBUG_PORT（.env，默认 5172）上打开一个测试用的 web 控制台，
#      能看 插件清单 / 日志 / 数据库 三个页面，无登录、直达。
#
# 为什么页面代码是 0 行：三个页面由官方 webui 页面插件提供，且每个包都
# 预置了 dist/manifest.json，不需要我们跑 Vite、不需要写任何前端代码。
# 这正是铁律 1（禁止手写样式）能成立的原因 —— 见 .rules/IRON-RULES.md 选型表。
#
# 为什么要第二个 server 实例：@cordisjs/plugin-webui 只 inject('server')，
# 默认会挂到后端 8080 上，那样调试页就和正式后端混在一个端口了。
# `isolate: { server: debug }` 把「server」这个**服务名**换到独立 realm：
# 带同样 isolate 的插件互相看见，不带的人看不见 —— 于是 webui 只认 5172。
# 机制出处：@cordisjs/plugin-loader/lib/config/isolate.d.ts
#   isolate?: Dict<true | string>   （值为 realm 标签，同标签共享实例）
- id: debug-server
  name: '@cordisjs/plugin-server'
  isolate:
    server: debug
  config:
    host: !!js process.env.APP_HOST ?? '0.0.0.0'
    port: !!js Number(process.env.DEBUG_PORT ?? 5172)

# webui 依赖 timer 服务（页面轮询/节流用）。
- id: debug-timer
  name: '@cordisjs/plugin-timer'

# 控制台外壳 + 服务端路由。与 debug-server 同 realm，才能拿到 5172 那个 server。
- id: debug-webui
  name: '@cordisjs/plugin-webui'
  isolate:
    server: debug
  config:
    # devMode 必须显式关掉。它默认取 NODE_ENV === 'development'（本机就是），
    # 打开后 webui 会临时起一个 Vite、去跑 @cordisjs/client 的**源码**，
    # 实测页面空白、模块 404（theme/menu/menu.vue 之类，2026-09-27）。
    # 关掉后走各包自带的 dist/ 预构建产物 —— 我们零 UI 代码，本来也不需要
    # 前端 HMR。这就是官方「生产态」路径。
    devMode: false
    open: false

# ── 三个页面插件 ───────────────────────────────────────────────────────
# ① 插件系统查看：扫描 node_modules 里带 cordis 字段的包，可看可启停。
- id: debug-loader-webui
  name: '@cordisjs/plugin-loader-webui'

# ② 日志系统：把 ctx.logger 的日志落到 sqlite，在页面上看。
#    注意它 import 了 node:sqlite —— 所以 Node 必须 ≥ 22.5（见 scripts/env.sh）。
- id: debug-logger-webui
  name: '@cordisjs/plugin-logger-webui'
  config:
    path: !!js process.cwd() + '/data/logs.db'

# ③ 数据库系统：需要 model 服务（@cordisjs/plugin-database）+ 一个驱动。
- id: debug-database
  name: '@cordisjs/plugin-database'

- id: debug-database-sqlite
  name: '@cordisjs/plugin-database-sqlite'
  config:
    path: !!js process.cwd() + '/data/database.db'

- id: debug-database-webui
  name: '@cordisjs/plugin-database-webui'

# ── 业务实现：P1 ───────────────────────────────────────────────────────
# ctx.session / ctx.eventLog 的 sqlite 后端（impl/space-store-sqlite）。
# 依赖 database 服务（debug-database-sqlite 驱动提供的那个），自动排在其后；
# path 与 debug-database-sqlite 显式写成**同一个文件** —— 5172 数据库页看的
# 就是它。表结构一律由 npm run migrate 从 migrations/ 建（断言 ⑧），
# 插件里没有一行 DDL；启动时校验 schema_version，不一致拒绝启动。
- id: space-store-sqlite
  name: './packages/impl/space-store-sqlite/src/index.ts'
  config:
    path: !!js process.cwd() + '/data/database.db'

# ── 业务插件：P2（交互元素）────────────────────────────────────────────
# ctx.commands 注册表的唯一提供者（指令实现、入站路由、P3 的 authz 都依赖它）。
- id: command-bus
  name: './plugins/command-bus/index.ts'

# 暂存区指令族（/add /cur /del /change /clear /commit）+ 入站消息路由。
# inject 声明依赖 server / commands / staging / session，加载顺序由依赖决定。
- id: staging-commands
  name: './plugins/staging-commands/index.ts'
