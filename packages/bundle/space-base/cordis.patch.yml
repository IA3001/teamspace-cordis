# space-base —— 组合层第一片：核心行（P5，断言③的「一个 bundle 层」之一）
#
# 角色与语法（对照 deepseek-harness 的 bundle 形状，MODULE-PLAN 3.6 节）：
#   · 这里只放「随模式取值无关」的核心行：框架设施 + 全部业务服务提供者
#   · 每行最多出现在「一个 bundle 层 + 用户层」——base 与各 surface 不得出现同 id
#   · 用户层（profiles/*/cordis.patch.yml）可按 id 覆盖 config / 写 disabled 停用 / 追加新行
#   · 本文件由 src/compose.ts 在启动时叠加，不再被直接加载
#
# 从旧 cordis.yml 原样迁入（2026-09-28 P5），注释保留原决策上下文。

# ── 框架设施 ────────────────────────────────────────────────────────────
# 官方 HTTP 服务（提供 ctx.server，路由挂在它上面）。
# host/port 来自 .env —— 全系统端口唯一出处，不在这里写死数字。
- id: server
  name: '@cordisjs/plugin-server'
  config:
    host: !!js process.env.APP_HOST ?? '0.0.0.0'
    port: !!js Number(process.env.APP_PORT ?? 8080)

# ── 业务插件 ────────────────────────────────────────────────────────────
# 健康检查：证明端口真的在听，也是后续所有路由的样板（inject 声明依赖）。
- id: health
  name: './plugins/health/index.ts'

# 最早那个试金石插件，保留用于验证「加功能 = 加插件」。
- id: app
  name: './plugins/app/index.ts'
  config:
    greeting: cordis 框架已启动，一切就绪

# 曾试挂官方 @cordisjs/plugin-logger（控制台日志导出器），**已撤掉**：
# 它与 cordis@4.0.0-rc.10 组合下 ctx.logger().info/warn/error 全部静默
# （实测 3 次，2026-09-26）。core 自带的 ctx.logger.exporter({ export })
# 接口本身可用，是插件侧的消息形状没接上 —— RC 阶段的集成缺口。
# 需要日志时再单独写一个基于 core 接口的 logger 插件。

# ── 业务实现：P1 ───────────────────────────────────────────────────────
# ctx.session / ctx.eventLog 的 sqlite 后端（impl/space-store-sqlite）。
# 依赖 database 服务（space-surface-debug 的 debug-database-sqlite 驱动提供的那个），
# 自动排在其后；path 与它显式写成**同一个文件** —— 5172 数据库页看的就是它。
# 表结构一律由 npm run migrate 从 migrations/ 建（断言 ⑧），插件里没有一行
# DDL；启动时校验 schema_version，不一致拒绝启动。
- id: space-store-sqlite
  name: './packages/impl/space-store-sqlite/src/index.ts'
  config:
    path: !!js process.cwd() + '/data/database.db'

# ── 业务插件：P2（交互元素）────────────────────────────────────────────
# ctx.commands 注册表的唯一提供者（指令实现、入站路由、P3 的 authz 都依赖它）。
- id: command-bus
  name: './plugins/command-bus/index.ts'

# 暂存区指令族（/add /cur /del /change /clear /commit）+ 入站消息路由。
# inject 声明依赖 server / commands / staging / session，加载顺序由依赖决定。
- id: staging-commands
  name: './plugins/staging-commands/index.ts'

# 登录/注册 HTTP 口（IM 化，2026-09-30）：/api/auth/register|login|logout|me
# + Set-Cookie HttpOnly space_token。ctx.users 由 space-store-sqlite 提供。
- id: space-cors
  name: './plugins/space-cors/index.ts'
- id: space-auth
  name: './plugins/space-auth/index.ts'

# 消息推送（IM 化，2026-09-30）：socket 广播 'space:event'（由另一代理实现，
# 此处只管注册进合成源）。
- id: space-message
  name: './plugins/space-message/index.ts'

# 工具层（P9，2026-10-01）：ctx.tools 唯一提供者 —— 工具注册表 + allowlist
# 闸门 + 每笔调用留痕（铁律 2）。allow 配置了就只放行清单内的 toolId
#（其余 not_allowed），缺省全放行；能力方注册、使用方按名调用（反模式 2）。
- id: space-tool
  name: './plugins/space-tool/index.ts'
  config:
    allow: ['tool.workspace.read', 'tool.workspace.write', 'tool.code.execute', 'web.search']

# Personal read/write, team-shared read-only, and Docker-isolated code execution.
- id: sandbox-tools
  name: './plugins/sandbox-tools/index.ts'

# Web search uses the separately configured search.baseURL/search.apiKey pair.
- id: tool-web-search
  name: './plugins/tool-web-search/index.ts'

# 检索层（P9，2026-10-01，分层 L3）：ctx.retrieval 唯一提供者 —— event FTS
# 与 memory 两数据源统一成一个检索面，score 粗排降序截 limit；纯读零副作用。
- id: space-retrieval
  name: './plugins/space-retrieval/index.ts'

# 上下文注入层（P9，2026-10-01，分层 L4）：ctx.context 唯一提供者 ——
# prompt 模板 + 最近历史 + 记忆召回 + 检索命中统一组装并裁字符预算。
# Agent/大脑调 LLM 前一律走本缝取上下文，注入逻辑只有一份。
- id: space-context
  name: './plugins/space-context/index.ts'

# ── 业务插件：P3（协作大脑）────────────────────────────────────────────
# ctx.orchestrator 服务提供者 + Plan 触发的接管者：IM 化后触发源双轨 ——
# 'staging/plan'（/commit 兼容路径）+ 'space/plan'（@提及直达，主路径），
# agent 事件经 'space/event-appended' 回流续步。名单校验 / 三级兜底走
# policy/space-authz 纯函数。协调者大脑通过 ctx.orchestrator.registerBrain
# 注入（P3 拍板：不含真实 LLM 适配器，只留接口；未注册 → coordinator_unconfigured
# 暂停等人类，安全默认）。回合状态进程内存，重启回 static；共享会话租约由 SQLite 提供。
# autonomyBudget：每回合 AI 自主动作预算（IM 化拍板 2026-09-30；超限
# budget_exhausted 暂停等人类 —— 这是「AI 高度自治」的安全护栏）。
- id: orchestrator
  name: './plugins/orchestrator/index.ts'
  config:
    autonomyBudget: 8

# 占位大脑（P8，2026-09-30）：第一个真实挂在 registerBrain 上的 OrchestratorBrain，
# 让委托回路端到端可观测。**非 NLP**：@ 提示命中授权名册 → 合法 JSON 委托
#（instruction=人类原话），否则纯文本回复；文案处处明示占位。config.enabled=false
#（用户层覆盖）= 回到 coordinator_unconfigured 安全默认。文字模型未配置时启用；
#后台/API 配置或 LLM_* 环境变量就绪后，本包让位给 brain-llm。
- id: brain-stub
  name: './plugins/brain-stub/index.ts'
  config:
    enabled: true

# 真大脑（P8 下半场，2026-09-30）：与 brain-stub 互斥（确定性选择 —— .env
# 三件套齐 → 本包注册、stub 让位；不齐 → stub 上线）。原始输出交给既有三级
# 兜底解析（零改动）；调用失败 → coordinator_error 暂停。config.enabled=false
# = 回 coordinator_unconfigured 安全默认。
- id: brain-llm
  name: './plugins/brain-llm/index.ts'

# ── 只读查询 + 面板注册表（P4）──────────────────────────────────────────
# 只读口：时间线/成员页的数据源（HTTP 可 curl 观测）；写路径仍然只在
# staging-commands 的 POST /messages，这里一个写口都不加。
- id: space-api
  name: './plugins/space-api/index.ts'

# ctx.ui 唯一提供者：各 client-ui 区域包往这一个实例登记 Panel 描述符。
- id: ui-registry
  name: './plugins/ui-registry/index.ts'

# ── 业务插件：P6（多智能体入驻，2026-09-29）────────────────────────────
# ctx.agents 唯一提供者（机制行，P6 一次性建设；铁律 4：入驻 = 向 space-agent 缝注册）。
# 此后的新 agent **不改本文件**：新增包 + 自带 bundle 层一行
# （packages/bundle/space-agent-*/，compose 扫描自动发现）。
- id: agent-registry
  name: './plugins/agent-registry/index.ts'

# 会话消息静默入站到每个已邀请 Agent 的独立记忆流；SQLite 会话槽位提供跨进程
# 单活动会话租约与 FIFO 等待意图，@ 回复前由 orchestrator 等 Inbox 追上触发消息。
- id: agent-inbox
  name: './plugins/agent-inbox/index.ts'

# 团队创建的 Agent 由统一 runtime 处理；目录实例不需要新增 Cordis 插件。
- id: agent-runtime-dispatcher
  name: './plugins/agent-runtime-dispatcher/index.ts'

# ctx.workdir 的本机实现（P6 收尾，2026-09-30）：每 agent 一区
# （<cwd>/data/workdirs/<agentId>，与 store 的 data/ 同源约定）；
# claim 先验入驻名单（space-agent 缝），resolve 路径边界判定（execdir 铁则）。
- id: space-workdir-local
  name: './packages/impl/space-workdir-local/src/index.ts'

# ctx.agentRuntime（P8，2026-09-30）：coding 类共享干活路径的机制行 ——
# P6 在案记账的升格兑现（从 agent-coder-stub 迁入 perform 与 /tell 直派口）。
# 此后 coding agent 包收敛为「描述符 + 委托认领」（铁律 4：入驻 = 纯新增）。
# ctx.llm：OpenAI 兼容单次补全（不重试、60s 超时）。配置优先读后台 settings，
# 再读插件配置和 .env 的 LLM_* 三件套；未配置也照常提供（configured=false）。
- id: space-llm-openai
  name: './packages/impl/space-llm-openai/src/index.ts'

# ctx.embeddings（2026-10-01）：OpenAI 兼容 /embeddings 批量文本向量（分批、
# 不重试、60s 超时）。配置面板化：面板留空回退 .env 的 EMBED_* 三件套
#（Embedding 可与 LLM 不同供应商）；未配置也照常提供（configured=false）。
- id: space-embedding-openai
  name: './packages/impl/space-embedding-openai/src/index.ts'

- id: space-agent-runtime
  name: './packages/impl/space-agent-runtime/src/index.ts'

# 会议 Agent（真模型示范，2026-10-01）：第一个走全分层组合的会议角色 ——
# L7 委托 → L4 组装 → L0 单次调用 → L8 发言；LLM 未配置/失败回退【占位】。
# 铁律 4：加一个会议 bot = 复制本条 + 改 config（role/agentId/title），零改码。
- id: agent-analyst-llm
  name: './plugins/agent-analyst-llm/index.ts'
  disabled: true
  config:
    role: 需求分析师
    agentId: a_analyst
    title: 需求分析师
    promptRef: prompt.minutes

# 事件视图过滤器（分层 L5 会话层，2026-10-01）：ctx.history.view ——
# eventLog 的纯过滤视图（作者种类/事件种类/时间窗/条数），供显示层按口径取数。
- id: space-history
  name: './plugins/space-history/index.ts'

# 文件消息（2026-10-01，最小可行版）：POST /api/upload（cookie 鉴权，20MB 上限）
# + GET /api/uploads/:name（免鉴权局域网下载，防目录穿越）。文件不进事件新列，
# 前端把下载 url 拼进消息文本（[文件] 开头）走现有消息链路。
- id: space-upload
  name: './plugins/space-upload/index.ts'

# 回合记忆沉淀观察者（2026-10-01）：completed 收束 → memory.remember ——
# AI「记得上次聊到哪」的机制面；独立观察者，流转层保持零记忆职责。
- id: memory-recorder
  name: './plugins/memory-recorder/index.ts'

# /summary 指令（2026-10-01）：一键让会议记录官生成本会话纪要 —— L4 组装
#（prompt.minutes + 最近 60 条）→ L0 单次调用 → L8 以 a_recorder 上时间线。
# LLM 未配置/失败回【占位】，诚实标注（铁律：不猜不重试）。
- id: ai-summary
  name: './plugins/ai-summary/index.ts'

# /todo 团队待办（2026-10-01）：四条指令（list/done/del + 记账）——存储复用
# 记忆层（kind='todo'），append-only 上以 forget+remember 实现状态翻转。
- id: ai-todo
  name: './plugins/ai-todo/index.ts'

# 账号管理页（2026-10-01）：挂 5172 调试控制台（debug webui 的 webui 服务是
# 无名默认实例 —— 不写 webui isolate 即消费它，同 debug-loader-webui 口径）。
# users RPC 全部首参 token 且仅管理员放行；ctx.users 由 space-store-sqlite 提供。
- id: client-ui-admin
  name: './packages/client-ui/space-client-ui-admin/src/index.ts'

- id: kb-embedder
  name: './plugins/kb-embedder/index.ts'

# 回合视图（分层 L8 协作层，2026-10-01）：ctx.dialog.turns —— 事件流折叠的
# 只读回合口径（人类消息开回合、系统事件收束），显示层/协作面板可查。
- id: space-dialog
  name: './plugins/space-dialog/index.ts'

# 确定性服务流程指令（MC 式，2026-10-01）：/code /test /review —— 指令=流程、
# 步骤=agent，结果事件回流自动接力；与「@提及自由协作」双轨并存（章程第七节）。
- id: flow-commands
  name: './plugins/flow-commands/index.ts'

# 会话 DRI 固定决策指令：通过、否决、暂缓、撤回与重做 Agent 最终回答。
- id: decision-commands
  name: './plugins/decision-commands/index.ts'
