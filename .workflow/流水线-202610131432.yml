version: "1.0"
name: 构建、部署到自有主机
displayName: 构建、部署到自有主机
stages:
- name: 未命名
  displayName: 未命名
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: 52c6d36d-ab8f-4aa6-93c1-46ddac2fbc5a
    displayName: Nodejs 构建
    nodeVersion: 14.16.0
    commands:
    - '# 设置NPM源，提升安装速度'
    - npm config set registry https://registry.npmmirror.com
    - ""
    - '# 执行编译命令'
    - npm install && npm run build
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./dist
      type: .tar.gz
    caches:
    - "~/.npm"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
