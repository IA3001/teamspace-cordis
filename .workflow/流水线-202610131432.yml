version: "1.0"
name: teamspace-cordis-ci
displayName: Teamspace Cordis CI

triggers:
  push:
    - matchType: PRECISE
      branch: rebuild-20261009

stages:
  - name: ci
    displayName: 完整 CI
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: teamspace_cordis_ci
        displayName: 运行项目完整检查
        nodeVersion: "22.5.0"
        commands:
          - node --version
          - npm --version
          - .ci/run.sh {GITEE_COMMIT}
        strategy:
          retry: "0"