name: CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Change budgets and protected test changes
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          npm run lint:changes -- "$BASE_SHA"
  gate:
    name: full-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Configure XFS-backed Docker storage quotas
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs
          sudo systemctl stop docker
          sudo truncate -s 8G /mnt/docker-xfs.img
          sudo mkfs.xfs -f /mnt/docker-xfs.img
          sudo mkdir -p /mnt/docker-xfs
          sudo mount -o loop,pquota /mnt/docker-xfs.img /mnt/docker-xfs
          sudo mkdir -p /mnt/docker-xfs/docker
          echo '{"storage-driver":"overlay2","data-root":"/mnt/docker-xfs/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          test "$(docker info --format '{{.Driver}}')" = overlay2
          test "$(findmnt -n -o FSTYPE -T /mnt/docker-xfs/docker)" = xfs
          findmnt -n -o OPTIONS -T /mnt/docker-xfs/docker | grep -Eq '(^|,)(pquota|prjquota)(,|$)'
      - run: .ci/run.sh "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results
          path: data/ci/
          retention-days: 7
          if-no-files-found: warn
